<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubbo - Módulo Productividades</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Contenedor que actúa como máscara/recorte */
    .crop-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 
      Ajustes del iframe:
      Usa valores negativos en top/left para mover la página original 
      y ocultar los menús/barras superiores y laterales de Lovable.
    */
    .crop-wrapper iframe {
      position: absolute;
      /* Ajusta este valor si deseas ocultar el menú superior (ej. -60px) */
      top: 0px; 
      /* Ajusta este valor si deseas ocultar la barra lateral izquierda (ej. -200px) */
      left: 0px; 
      
      /* Aumentamos el tamaño total para compensar los recortes */
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="crop-wrapper">
    <iframe src="https://paqueteriacubbo.lovable.app/productividades"></iframe>
  </div>

</body>
</html>

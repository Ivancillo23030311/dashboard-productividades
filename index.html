<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Productividades - Cubbo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 0.8rem 1.5rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .status {
      font-size: 0.85rem;
      color: #10b981;
      font-weight: 500;
    }
    main {
      flex: 1;
      padding: 0.5rem;
      display: flex;
    }
    .card {
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cubbo | Vista de Productividades</h1>
    <span class="status">● Conectado</span>
  </header>

  <main>
    <div class="card">
      <iframe src="https://paqueteriacubbo.lovable.app/productividades"></iframe>
    </div>
  </main>

</body>
</html>

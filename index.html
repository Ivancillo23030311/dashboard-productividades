<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubbo - Productividades</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Contenedor que recorta los menús */
    .crop-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 
      El iframe se desplaza hacia la izquierda (-240px) 
      y hacia arriba (-60px) para ocultar las barras.
    */
    .crop-wrapper iframe {
      position: absolute;
      top: -60px; 
      left: -240px; 
      
      /* Compensamos el espacio desplazado para que llene la pantalla */
      width: calc(100vw + 240px);
      height: calc(100vh + 60px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="crop-wrapper">
    <iframe src="https://paqueteriacubbo.lovable.app/productividades"></iframe>
  </div>

</body>
</html>
